name: Sign and package macOS app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to process (e.g. v1.0.0)
        required: true

jobs:
  sign-and-package:
    runs-on: macos-latest

    steps:
      - name: Download macOS asset from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.event.release.tag_name || github.event.inputs.tag }}
          echo "TAG=$TAG" >> $GITHUB_ENV
          gh release download "$TAG" \
            --pattern "Dabdoob-mac-beta.app.zip" \
            --repo "${{ github.repository }}"

      - name: Unzip app bundle
        run: ditto -xk Dabdoob-mac-beta.app.zip .

      - name: Find and codesign app bundle
        run: |
          APP_PATH=$(find . -name "*.app" -maxdepth 5 | head -1)
          echo "Found app at: $APP_PATH"
          EXE_PATH=$(find "$APP_PATH/Contents/MacOS" -type f | head -1)
          echo "Found main executable at: $EXE_PATH"

          # The bundled executable ships with a malformed ad-hoc signature (two
          # CodeDirectory blobs both claiming slot 0) that crashes codesign when
          # it tries to parse or remove it (both --remove-signature and a plain
          # --force resign fail on it). Strip the existing LC_CODE_SIGNATURE load
          # command and its trailing data by hand so codesign gets a clean,
          # unsigned Mach-O to sign.
          #
          # This also preflights the file for truncation: if an uploaded build
          # has a fat-binary architecture slice whose declared offset+size runs
          # past the actual file length, fail here with a clear message instead
          # of the cryptic "main executable failed strict validation" /
          # "truncated or malformed fat file" errors codesign/lipo give later.
          python3 - "$EXE_PATH" <<'PYEOF'
          import struct, sys

          path = sys.argv[1]
          with open(path, 'rb') as f:
              data = bytearray(f.read())
          file_len = len(data)

          def strip_thin(base):
              magic = struct.unpack_from('<I', data, base)[0]
              if magic != 0xfeedfacf:  # not a 64-bit Mach-O, leave it alone
                  return None
              ncmds, sizeofcmds = struct.unpack_from('<II', data, base + 16)
              off = base + 32
              cmds_end = off + sizeofcmds
              write_ptr = off
              new_ncmds = 0
              new_sizeofcmds = 0
              new_size = None
              datasize = None
              linkedit_cmd_off = None
              for _ in range(ncmds):
                  cmd, cmdsize = struct.unpack_from('<II', data, off)
                  if cmd == 0x19:  # LC_SEGMENT_64
                      segname = data[off + 8:off + 24].rstrip(b'\x00')
                      if segname == b'__LINKEDIT':
                          linkedit_cmd_off = off
                  if cmd == 0x1d:  # LC_CODE_SIGNATURE
                      dataoff, ds = struct.unpack_from('<II', data, off + 8)
                      new_size = dataoff
                      datasize = ds
                  else:
                      if write_ptr != off:
                          data[write_ptr:write_ptr + cmdsize] = data[off:off + cmdsize]
                      write_ptr += cmdsize
                      new_ncmds += 1
                      new_sizeofcmds += cmdsize
                  off += cmdsize
              if new_size is not None:
                  for j in range(write_ptr, cmds_end):
                      data[j] = 0
                  struct.pack_into('<II', data, base + 16, new_ncmds, new_sizeofcmds)
                  # __LINKEDIT's declared size covers the code signature blob
                  # too, so shrink it by the same amount or codesign sees a
                  # segment that runs past the end of the (now shorter) file.
                  if linkedit_cmd_off is not None and datasize:
                      vmsize, = struct.unpack_from('<Q', data, linkedit_cmd_off + 32)
                      filesize, = struct.unpack_from('<Q', data, linkedit_cmd_off + 48)
                      struct.pack_into('<Q', data, linkedit_cmd_off + 32, vmsize - datasize)
                      struct.pack_into('<Q', data, linkedit_cmd_off + 48, filesize - datasize)
              return new_size

          magic = struct.unpack_from('<I', data, 0)[0]
          if magic == 0xbebafeca:  # fat binary (big-endian FAT_MAGIC read as little-endian)
              nfat = struct.unpack_from('>I', data, 4)[0]
              for i in range(nfat):
                  entry_off = 8 + i * 20
                  cputype, cpusubtype, offset, size, align = struct.unpack_from('>iiIII', data, entry_off)
                  if offset + size > file_len:
                      missing = offset + size - file_len
                      pct = missing / size * 100
                      sys.exit(
                          f'ERROR: architecture slice (cputype={cputype}) at offset {offset} declares '
                          f'size {size}, but the file is only {file_len} bytes -- {missing} bytes '
                          f'({pct:.1f}%) of this slice are missing. The uploaded app bundle is truncated/'
                          f'corrupted, not a codesign issue. Re-export the macOS build and re-upload the '
                          f'release asset.'
                      )
                  new_size = strip_thin(offset)
                  if new_size is not None:
                      struct.pack_into('>iiIII', data, entry_off, cputype, cpusubtype, offset, new_size, align)
                      print(f'stripped signature from arch slice at {offset}: {size} -> {new_size} bytes')
          else:
              new_size = strip_thin(0)
              if new_size is not None:
                  print(f'stripped signature: {len(data)} -> {new_size} bytes')

          with open(path, 'wb') as f:
              f.write(data)
          PYEOF

          echo "--- diagnostic: try signing each thin arch slice separately ---"
          lipo -archs "$EXE_PATH" || true
          for ARCH in x86_64 arm64; do
            lipo -thin "$ARCH" "$EXE_PATH" -output "/tmp/thin_$ARCH" && \
            echo "== $ARCH ==" && \
            codesign --force --sign - -vvvv "/tmp/thin_$ARCH" 2>&1 || echo "$ARCH FAILED (see above)"
          done

          codesign --force --deep --sign - -vvvv "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Build DMG
        run: |
          mkdir _dmg_tmp
          cp -R "$APP_PATH" _dmg_tmp/
          ln -s /Applications _dmg_tmp/Applications
          hdiutil create \
            -volname "Dabdoob" \
            -srcfolder _dmg_tmp \
            -ov \
            -format UDZO \
            Dabdoob-mac-beta.dmg

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            Dabdoob-mac-beta.dmg \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Remove zip asset from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset "$TAG" \
            Dabdoob-mac-beta.app.zip \
            --repo "${{ github.repository }}" \
            --yes
